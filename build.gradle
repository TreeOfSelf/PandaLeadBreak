plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.0-alpha.16'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.register('generateFabricServerStarter') {
	group = 'fabric'
	description = 'Writes server/launch-with-gradle-jdk.sh and .bat using the Java 25 toolchain Gradle resolves.'
	doLast {
		def launcher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(25)
		}.get()
		def home = launcher.metadata.installationPath.asFile
		def javaUnix = new File(home, "bin/java").absolutePath.replace('\\', '/')
		def javaWin = new File(home, "bin/java.exe").absolutePath.replace('/', '\\')
		def serverDir = layout.projectDirectory.dir('server').asFile
		serverDir.mkdirs()
		def sh = new File(serverDir, 'launch-with-gradle-jdk.sh')
		sh.text = "#!/usr/bin/env bash\nset -euo pipefail\ncd \"\$(dirname \"\$0\")\"\nif [[ ! -f fabric-server-launch.jar ]]; then\n  echo \"Run the Fabric server installer in this directory first.\" >&2\n  exit 1\nfi\nexec \"${javaUnix}\" -Xmx2G -jar fabric-server-launch.jar nogui \"\$@\"\n"
		sh.setExecutable(true, false)
		def bat = new File(serverDir, 'launch-with-gradle-jdk.bat')
		bat.text = "@echo off\r\nsetlocal EnableExtensions\r\ncd /d \"%~dp0\"\r\nif not exist \"fabric-server-launch.jar\" (\r\n  echo Run the Fabric server installer in this directory first.\r\n  exit /b 1\r\n)\r\n\"${javaWin}\" -Xmx2G -jar fabric-server-launch.jar nogui %*\r\n"
	}
}

tasks.named('build') {
	finalizedBy 'generateFabricServerStarter'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}